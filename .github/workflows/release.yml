name: 发布应用

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win nsis --publish never
      - name: 发布安装包
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "v$version" release/*.exe release/*.blockmap release/latest.yml --target "$env:GITHUB_SHA" --title "招迹 v$version" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
